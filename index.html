<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>להדליק דוד?</title>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Frank+Ruhl+Libre:wght@300;500;700&family=Heebo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#2b1007; --choc:#4a1f0c; --milk:#7a3a17; --spread:#5c2810;
  --cream:#fff3e0; --cream2:#f6dcb6; --hazel:#c98a4f; --flame:#ff7a2b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Heebo",Arial,sans-serif;color:var(--dark);overflow:hidden;background:var(--choc)}

/* molten chocolate background */
.molten{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.nut{position:fixed;z-index:1;width:64px;height:64px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}

.screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px;z-index:2}
.screen.on{display:flex}
.card{
  position:relative;width:min(92vw,420px);
  padding:78px 26px 34px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:16px;
  background:
    radial-gradient(120% 70% at 30% 0%, #fffaf2 0 30%, transparent 60%),
    linear-gradient(180deg,var(--cream),var(--cream2));
  border-radius:40px 40px 48px 48px;
  box-shadow:0 24px 50px rgba(0,0,0,.5), inset 0 -10px 0 rgba(201,138,79,.35);
}
.on .card{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.card-drip{position:absolute;top:-1px;left:0;width:100%;height:72px;pointer-events:none;z-index:1;clip-path:inset(0 round 40px 40px 0 0)}

h1{font-family:"Suez One","Heebo",Georgia,serif;font-weight:400;font-size:clamp(2.2rem,10vw,3.3rem);line-height:1.05;color:var(--choc)}
p{font-size:clamp(1.1rem,4.6vw,1.35rem);line-height:1.5;color:var(--milk);max-width:26ch}
.boiler{width:64px;height:auto;color:var(--choc);margin-top:-6px}
.boiler{--glow:#c98a4f}
.hot .boiler{--glow:#ff7a2b}

.yes{
  position:relative;font-family:"Suez One","Heebo",Georgia,serif;font-size:clamp(3rem,17vw,5rem);
  color:var(--cream);border:0;cursor:pointer;margin:6px 0 22px;
  width:100%;padding:.18em 0 .28em;border-radius:999px;
  background:linear-gradient(180deg,#8a4220 0%,var(--spread) 45%,var(--dark) 100%);
  box-shadow:0 8px 0 #1c0a04, 0 18px 28px rgba(43,16,7,.45), inset 0 -6px 12px rgba(0,0,0,.35);
  text-shadow:0 2px 0 rgba(0,0,0,.4);
  transition:transform .1s, box-shadow .1s;
}
.yes::before{ /* glossy highlight */
  content:"";position:absolute;top:9%;left:12%;width:60%;height:28%;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,230,200,.55),rgba(255,230,200,0));
}
.yes::after{ /* drip under the button */
  content:"";position:absolute;bottom:-20px;left:30%;width:16px;height:28px;
  background:var(--dark);border-radius:0 0 10px 10px;
  box-shadow:110px -8px 0 -2px var(--dark), 58px -12px 0 -5px var(--dark);
}
.yes:active{transform:translateY(7px);box-shadow:0 1px 0 #1c0a04, 0 6px 12px rgba(43,16,7,.4), inset 0 -6px 12px rgba(0,0,0,.35)}
.yes:focus-visible{outline:4px solid var(--hazel);outline-offset:5px}

.no{font-size:9px;padding:2px 6px;border-radius:5px;border:1px solid var(--cream2);
  background:transparent;color:#c9a888;pointer-events:none;user-select:none}
.no.runner{position:fixed;font-size:14px;padding:4px 12px;z-index:5;border-radius:999px;
  background:var(--cream);color:var(--milk);border:0;box-shadow:0 3px 8px rgba(0,0,0,.4);
  transition:top var(--sp) ease,left var(--sp) ease}
.no.runner.slow{font-size:10px;padding:2px 8px}

.flame{font-size:4.5rem;animation:flick 1s infinite alternate}
@keyframes flick{to{transform:scale(1.12) rotate(-4deg)}}
@media (prefers-reduced-motion: reduce){.on .card,.flame{animation:none}}

/* dynamic drips */
.card>*:not(.strand):not(.drop):not(.card-drip){position:relative;z-index:2}
.strand{position:absolute;top:22px;z-index:1;width:calc(var(--w)*2.4);height:var(--h);
  left:var(--x);margin-left:calc(var(--w)*-1.2);transform-origin:top;overflow:visible;
  filter:drop-shadow(0 4px 3px rgba(43,16,7,.35));
  animation:stretch var(--t) cubic-bezier(.45,0,.55,1) var(--d) infinite;}
@keyframes stretch{0%{transform:scaleY(.55)}75%{transform:scaleY(1.12)}88%{transform:scaleY(.62)}100%{transform:scaleY(.55)}}
.drop{position:absolute;z-index:1;left:var(--x);top:calc(14px + var(--h));width:calc(var(--w)*.9);height:calc(var(--w)*1.1);
  margin-left:calc(var(--w)*-.45);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(circle at 35% 30%,#a65a2c,#3a1508 60%);opacity:0;
  animation:fall var(--t) cubic-bezier(.5,0,1,1) var(--d) infinite}
@keyframes fall{0%,74%{opacity:0;transform:translateY(0) scale(.6)}
  76%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(260px) scale(.8)}}
.yes::after{transform-origin:top;animation:bdrip 3.2s ease-in-out infinite}
@keyframes bdrip{0%,100%{height:22px}60%{height:38px}}
@media (prefers-reduced-motion: reduce){.strand,.drop,.yes::after{animation:none}}

/* ---- intro jar ---- */
#intro{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 45%,#5c2810,#220b04 75%);animation:introOut .45s 2.1s forwards}
@keyframes introOut{to{opacity:0;visibility:hidden}}
.jar{position:relative;width:min(70vw,300px);aspect-ratio:1;border-radius:50%;
  box-shadow:0 0 0 10px rgba(255,235,210,.14),0 0 0 15px rgba(255,235,210,.05),0 30px 60px rgba(0,0,0,.6);
  animation:dive .8s 1.45s cubic-bezier(.6,0,.9,.4) forwards}
@keyframes dive{to{transform:scale(7);opacity:0}}
.swirl{width:100%;height:100%;display:block;border-radius:50%}
.lid{position:absolute;inset:-16px;border-radius:50%;
  background:radial-gradient(circle at 35% 28%,#fff7d0,#ecbf52 30%,#b8831f 68%,#7a520f);
  box-shadow:inset 0 0 0 14px rgba(0,0,0,.06),inset 0 -8px 18px rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.5);
  animation:unscrew 1.15s .35s cubic-bezier(.5,0,.8,.6) forwards}
.lid::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(#b8831f 0 2deg,#f6d77a 2deg 4deg);
  -webkit-mask:radial-gradient(circle,transparent 89%,#000 90%);mask:radial-gradient(circle,transparent 89%,#000 90%)}
.lid::after{content:"";position:absolute;inset:22%;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.5),rgba(255,255,255,0) 60%)}
@keyframes unscrew{0%{transform:rotate(0)}55%{transform:rotate(-160deg)}100%{transform:translateY(-130vh) rotate(-300deg)}}

/* ---- bite ---- */
.yes .bite{position:absolute;border-radius:50%;background:#f8e4c4;z-index:3;transform:scale(0);
  transition:transform .12s ease-out}
.yes.bitten .bite{transform:scale(1)}
.crumb{position:fixed;z-index:16;width:7px;height:6px;border-radius:40%;background:#5c2810;pointer-events:none}

/* ---- finger trail ---- */
#trail,#trail2{position:fixed;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}

/* ---- hazelnut runner ---- */
.no.runner .nutico{display:none}
.no.runner.nut{width:64px;height:64px;padding:0;background:none;box-shadow:none;border-radius:50%;
  transition:top var(--sp) ease,left var(--sp) ease,transform var(--sp) linear}
.no.runner.nut .nutico{display:block;position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 5px 5px rgba(0,0,0,.45))}
.no.runner span{position:relative}
.no.runner.nut span{color:#fff3e0;font-weight:700;font-size:16px;top:5px;text-shadow:0 1px 3px #000}
@media (prefers-reduced-motion: reduce){#intro{display:none}}

/* ======== sensual layer ======== */
body{background:#120502}
.molten{opacity:.75}
#warm{position:fixed;inset:0;z-index:1;pointer-events:none;mix-blend-mode:screen;overflow:hidden}
#warm i{position:absolute;width:90vmax;height:90vmax;border-radius:50%;filter:blur(40px);opacity:.45;
  background:radial-gradient(circle,#ff8a3d 0,#b2401a 35%,transparent 65%)}
#warm i:first-child{left:-30vmax;top:-20vmax;animation:drift1 14s ease-in-out infinite alternate}
#warm i:last-child{right:-35vmax;bottom:-30vmax;opacity:.3;background:radial-gradient(circle,#ff5d6c 0,#7d1f2a 40%,transparent 65%);animation:drift2 18s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(35vmax,40vmax) scale(.8)}}
@keyframes drift2{to{transform:translate(-30vmax,-35vmax) scale(1.15)}}
#dust{position:fixed;inset:0;z-index:3;pointer-events:none}
#dust b{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:#ffd9a0;
  box-shadow:0 0 6px 2px rgba(255,190,110,.6);animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(var(--dx),-105vh);opacity:0}}

.card{
  background:
    radial-gradient(110% 60% at 70% 0%, rgba(160,80,40,.35) 0, transparent 60%),
    linear-gradient(180deg,#3a1508,#1d0803);
  border:1px solid rgba(232,170,120,.35);
  box-shadow:0 40px 80px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,210,170,.18), 0 0 60px rgba(255,120,60,.12);
}
.on .card{animation:slowin 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes slowin{from{transform:translateY(24px) scale(.97);opacity:0;filter:blur(6px)}to{transform:none;opacity:1;filter:none}}
h1{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:300;font-size:clamp(2.6rem,12vw,3.8rem);letter-spacing:.01em;
  background:linear-gradient(180deg,#fff3dc 0%,#f0c48c 55%,#b8783f 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
p{font-family:"Frank Ruhl Libre",Georgia,serif;color:#dcb58c;font-weight:300;font-size:clamp(1.15rem,4.8vw,1.4rem)}
.boiler{color:#e2b278;filter:drop-shadow(0 0 10px rgba(255,150,80,.35))}
.yes{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:700;color:#fff1dc;
  background:linear-gradient(180deg,#c06c34 0%,#7a3a17 48%,#3a1508 100%);
  box-shadow:0 8px 0 #1a0703, 0 0 0 1px rgba(255,200,150,.25), 0 18px 40px rgba(255,110,50,.35);
  animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.035)}24%{transform:scale(1)}36%{transform:scale(1.025)}50%{transform:scale(1)}}
.yes:active{animation:none}
.yes::after{background:#7a3a17;box-shadow:110px -8px 0 -2px #7a3a17, 58px -12px 0 -5px #7a3a17}
.yes .bite{background:#230c05}
.no{border-color:rgba(232,170,120,.3);color:#8f6a52}
.flame{filter:drop-shadow(0 0 22px rgba(255,120,40,.8))}

/* pour transition — realistic spread */
#pour{position:fixed;left:0;right:0;top:0;height:100vh;z-index:15;pointer-events:none;visibility:hidden;
  transform:translateY(-160%);filter:drop-shadow(0 18px 22px rgba(20,6,2,.65))}
#pour .tex{position:absolute;left:0;width:100%;background-image:var(--choctex);background-size:100% 900px;
  animation:flow .75s linear infinite}
@keyframes flow{from{background-position:0 0}to{background-position:0 900px}}
#pour .pour-all{top:-70px;bottom:-170px;
  -webkit-mask:var(--topmask) top/100% 70px no-repeat,linear-gradient(#000,#000) center/100% calc(100% - 238px) no-repeat,var(--dripmask) bottom/100% 170px no-repeat;
  mask:var(--topmask) top/100% 70px no-repeat,linear-gradient(#000,#000) center/100% calc(100% - 238px) no-repeat,var(--dripmask) bottom/100% 170px no-repeat}
</style>
</head>
<body>

<!-- glossy molten chocolate -->
<svg class="molten" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <radialGradient id="cg" cx="50%" cy="35%" r="80%">
      <stop offset="0" stop-color="#6e2f12"/><stop offset=".55" stop-color="#43190a"/><stop offset="1" stop-color="#220b04"/>
    </radialGradient>
    <filter id="gloss" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.009" numOctaves="2" seed="11" result="n"/>
      <feGaussianBlur in="n" stdDeviation="5" result="b"/>
      <feSpecularLighting in="b" surfaceScale="22" specularConstant="1" specularExponent="30" lighting-color="#ffcf9e" result="spec">
        <feDistantLight azimuth="235" elevation="50"/>
      </feSpecularLighting>
      <feComposite in="SourceGraphic" in2="spec" operator="arithmetic" k1="0" k2="1" k3=".5" k4="0"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#cg)" filter="url(#gloss)"/>
</svg>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="ng" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#d79a5c"/><stop offset=".6" stop-color="#9a5526"/><stop offset="1" stop-color="#5e2e12"/>
    </radialGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a1f0c"/><stop offset=".36" stop-color="#9a4e24"/><stop offset=".46" stop-color="#f0b07a"/><stop offset=".56" stop-color="#8a4220"/><stop offset="1" stop-color="#3a1508"/>
    </linearGradient>
    <linearGradient id="dg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2810"/><stop offset="1" stop-color="#8a4220"/>
    </linearGradient>
  </defs>
  <symbol id="hz" viewBox="0 0 60 60">
    <path d="M30 6c14 0 24 14 22 30-2 14-12 20-22 20S10 50 8 36C6 20 16 6 30 6Z" fill="url(#ng)"/>
    <path d="M12 22c4-12 12-16 18-16s14 4 18 16c-6 3-12 4-18 4s-12-1-18-4Z" fill="#6a3416"/>
    <path d="M16 18q14 6 28 0M20 13q10 4 20 0" stroke="#4a220c" stroke-width="1.5" fill="none"/>
    <ellipse cx="22" cy="36" rx="5" ry="9" fill="#fff" opacity=".22" transform="rotate(20 22 36)"/>
  </symbol>
  <symbol id="b" viewBox="0 0 100 140">
    <rect x="12" y="6" width="76" height="110" rx="38" fill="none" stroke="currentColor" stroke-width="7"/>
    <rect x="30" y="74" width="40" height="22" rx="6" style="fill:var(--glow)"/>
    <path d="M38 116v18M62 116v18" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
  </symbol>
  <symbol id="drip" viewBox="0 0 400 96" preserveAspectRatio="none">
    <path fill="url(#dg)" d="M0 0H400V22c-20 0-20 14-40 14s-20-12-40-12-20 16-40 16-20-14-40-14-20 12-40 12-20-14-40-14-20 16-40 16-20-12-40-12-20 14-40 14-20-14-40-14V0Z"/>
    <path d="M24 14q50 6 100 0M240 12q50 6 120 0" stroke="#a65a2c" stroke-width="3" stroke-linecap="round" fill="none" opacity=".7"/>
  </symbol>
</svg>

<svg class="nut" style="top:6%;right:5%;transform:rotate(-20deg)"><use href="#hz"/></svg>
<svg class="nut" style="top:14%;left:8%;width:44px;height:44px;transform:rotate(35deg)"><use href="#hz"/></svg>
<svg class="nut" style="bottom:8%;left:6%;transform:rotate(15deg)"><use href="#hz"/></svg>
<svg class="nut" style="bottom:14%;right:9%;width:50px;height:50px;transform:rotate(-60deg)"><use href="#hz"/></svg>
<svg class="nut" style="bottom:3%;right:40%;width:38px;height:38px;transform:rotate(80deg)"><use href="#hz"/></svg>

<section class="screen on" id="s1">
  <div class="card">
    <svg class="card-drip" viewBox="0 0 400 96" preserveAspectRatio="none"><use href="#drip"/></svg>
    <svg class="boiler"><use href="#b"/></svg>
    <h1>שלום ליאת</h1>
    <p>האם להדליק דוד?<br>לחצי על הכפתור המתאים.</p>
    <button class="yes" onclick="yes(this,'s2')">כן</button>
  </div>
</section>

<section class="screen" id="s2">
  <div class="card">
    <svg class="card-drip" viewBox="0 0 400 96" preserveAspectRatio="none"><use href="#drip"/></svg>
    <svg class="boiler"><use href="#b"/></svg>
    <h1>תודה על התשובה</h1>
    <p>את יכולה להתחרט.<br>האם להדליק דוד?</p>
    <button class="yes" onclick="yes(this,'done')">כן</button>
  </div>
</section>
<button class="no runner" id="runner" tabindex="-1" aria-disabled="true" style="display:none"><svg class="nutico"><use href="#hz"/></svg><span>לא</span></button>

<section class="screen" id="done">
  <div class="card">
    <svg class="card-drip" viewBox="0 0 400 96" preserveAspectRatio="none"><use href="#drip"/></svg>
    <div class="flame">🔥</div>
    <h1>תודה</h1>
    <p>פנייתך התקבלה ותטופל בהתאם.</p>
  </div>
</section>


<canvas id="trail"></canvas><canvas id="trail2" class="trail2"></canvas>

<div id="pour"><div class="tex pour-all"></div></div>
<div id="warm" aria-hidden="true"><i></i><i></i></div>
<div id="dust" aria-hidden="true"></div>

<div id="intro" aria-hidden="true"><div class="jar">
  <canvas class="swirl" width="640" height="640"></canvas>
  <div class="lid"></div>
</div></div>

<script>
const S=[[7,16,46,4.2,0],[24,22,88,5.1,1.3],[41,14,38,3.7,.6],[57,26,110,5.8,2.1],[74,15,62,4.6,.9],[90,18,52,4.9,1.8]];
document.querySelectorAll('.card').forEach(c=>S.forEach(([x,w,h,t,d])=>{
  const v=`--x:${x}%;--w:${w}px;--h:${h}px;--t:${t}s;--d:-${d}s`;
  const dr=document.createElement('i');dr.className='drop';dr.style.cssText=v;c.prepend(dr);
  c.insertAdjacentHTML('afterbegin',`<svg class="strand" style="${v}" viewBox="0 0 40 100" preserveAspectRatio="none"><path fill="url(#sg)" d="M0 0C8 0 12 10 14 30C15 50 13 70 12 82C11 92 15 99 20 99C25 99 29 92 28 82C27 70 25 50 26 30C28 10 32 0 40 0Z"/></svg>`);
}));
let t, rot=0, busy=false;
const r = document.getElementById('runner');
function jump(){
  const w = innerWidth - r.offsetWidth - 10, h = innerHeight - r.offsetHeight - 10;
  r.style.left = (5 + Math.random()*w) + 'px';
  r.style.top  = (5 + Math.random()*h) + 'px';
  if (r.classList.contains('nut')){ rot += (Math.random()<.5?-1:1)*(240+Math.random()*300); r.style.transform=`rotate(${rot}deg)`; }
  else r.style.transform='';
}
function run(sp, ms, slow){
  r.style.setProperty('--sp', sp+'s'); r.classList.toggle('slow', slow); r.classList.toggle('nut', !slow);
  r.style.display='block'; jump(); t=setInterval(jump, ms);
}
function go(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  clearInterval(t);
  r.style.display = 'none';
  if (id === 's1'){ run(.7, 900, true); }
  if (id === 's2'){ run(.16, 180, false); }
  if (id === 'done') document.body.classList.add('hot');
}

/* ===== realistic spread renderer ===== */
const BASE=[122,66,42], SPEC=[236,208,196];
function shadeTo(ctx,w,h,Hf,slope,mask){
  const H=new Float32Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)H[y*w+x]=Hf(x,y);
  const img=ctx.createImageData(w,h),D=img.data;
  const L=[-.45,-.62,.64],ll=Math.hypot(...L);L[0]/=ll;L[1]/=ll;L[2]/=ll;
  const Hv=[L[0],L[1],L[2]+1],hl=Math.hypot(...Hv);Hv[0]/=hl;Hv[1]/=hl;Hv[2]/=hl;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x, m=mask?mask(x,y):1; if(m<=0){D[i*4+3]=0;continue;}
    const xl=x>0?i-1:i, xr=x<w-1?i+1:i, yu=y>0?i-w:i, yd=y<h-1?i+w:i;
    let nx=-(H[xr]-H[xl])*slope, ny=-(H[yd]-H[yu])*slope, nz=1; const nl=Math.hypot(nx,ny,nz); nx/=nl;ny/=nl;nz/=nl;
    const dif=Math.max(0,nx*L[0]+ny*L[1]+nz*L[2]);
    const nh=Math.max(0,nx*Hv[0]+ny*Hv[1]+nz*Hv[2]);
    const sp=Math.pow(nh,14)*.16+Math.pow(nh,70)*.42;
    const ao=.78+.22*Math.min(1,Math.max(0,H[i]*.5+.5));
    for(let c=0;c<3;c++) D[i*4+c]=Math.min(255,BASE[c]*(.5+.6*dif)*ao+SPEC[c]*sp);
    D[i*4+3]=255*Math.min(1,m);
  }
  ctx.putImageData(img,0,0);
}
const TAU=Math.PI*2;
/* jar surface: knife swirl, meniscus at glass, a soft curl where the knife lifted */
(function(){
  const cv=document.querySelector('.swirl'); const N=cv.width, R=N/2, cx=cv.getContext('2d');
  shadeTo(cx,N,N,(x,y)=>{
    const dx=x-R,dy=y-R,r=Math.hypot(dx,dy),t=Math.atan2(dy,dx);
    const a=Math.min(1,r/(.35*R));
    let h=.9*Math.sin(r*.024+2*t+.5*Math.sin(t*2))*a
      +.45*Math.sin(x*.011+.3)*Math.sin(y*.013+1.1)
      +.25*Math.sin(r*.05-t+1.2)*a;
    const kx=dx-.18*R,ky=dy+.12*R; h+=2.2*Math.exp(-(kx*kx+ky*ky)/(2*(.16*R)**2));
    const ga=Math.max(0,Math.cos(t-2.4)); h-=.9*ga*ga*Math.exp(-((r-.58*R)**2)/(2*(.07*R)**2));
    h+=2.4*Math.max(0,(r-(R-60))/60)**2;
    return h;
  },4.2,(x,y)=>{const r=Math.hypot(x-R,y-R);return (R-r)/2;});
  // dark gap where spread meets glass
  const g=cx.createRadialGradient(R,R,R*.86,R,R,R);
  g.addColorStop(0,'rgba(30,10,4,0)');g.addColorStop(1,'rgba(30,10,4,.55)');
  cx.fillStyle=g;cx.beginPath();cx.arc(R,R,R,0,TAU);cx.fill();
})();
/* falling-curtain texture: vertical flow ribs, tileable in y */
(function(){
  const w=360,h=900,c=document.createElement('canvas');c.width=w;c.height=h;
  shadeTo(c.getContext('2d'),w,h,(x,y)=>{
    const u=x/w*TAU, v=y/h*TAU;
    return .7*Math.sin(u*4+1.2*Math.sin(v+.5)+.4*Math.sin(v*2+u))
      +.3*Math.sin(u*9+1.4*Math.sin(v*2+1.1)+.4)
      +.1*Math.sin(v*6+u*2+Math.sin(u*3));
  },7);
  const pour=document.getElementById('pour');
  pour.style.setProperty('--choctex',`url(${c.toDataURL('image/jpeg',.9)})`);
  // drip mask
  const drips=[[388,14,70],[352,22,150],[318,12,62],[290,18,118],[252,26,165],[214,13,80],[186,20,128],[148,15,60],[116,24,155],[82,14,92],[52,19,135],[20,16,76]];
  let d='M0 0H400V24';
  drips.forEach(([x,w,L])=>{w*=1.7;
    d+=`L${x+w} 24C${x+.5*w} 24 ${x+.22*w} ${.3*L} ${x+.22*w} ${.6*L}C${x+.22*w} ${.75*L} ${x+.36*w} ${.82*L} ${x+.34*w} ${.9*L}C${x+.32*w} ${.98*L} ${x+.15*w} ${L} ${x} ${L}`
     +`C${x-.15*w} ${L} ${x-.32*w} ${.98*L} ${x-.34*w} ${.9*L}C${x-.36*w} ${.82*L} ${x-.22*w} ${.75*L} ${x-.22*w} ${.6*L}C${x-.22*w} ${.3*L} ${x-.5*w} 24 ${x-w} 24`;
  });
  d+='L0 24Z';
  const svg=(vb,p)=>`url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='${vb}' preserveAspectRatio='none'><path d='${p}'/></svg>`)}")`;
  pour.style.setProperty('--dripmask',svg('0 0 400 170',d));
  pour.style.setProperty('--topmask',svg('0 0 400 70','M0 70C30 70 40 34 80 30S140 52 190 48 250 16 300 20 370 56 400 70Z'));
})();
setTimeout(()=>{const i=document.getElementById('intro'); if(i) i.remove();},2700);

/* bite + crumbs + pour */
const B=[[-12,-16,46],[30,-22,44],[-20,24,40]];
function yes(btn,next){
  if(busy) return; busy=true;
  if(!btn.querySelector('.bite')) B.forEach(([x,y,z])=>{const b=document.createElement('i');b.className='bite';
    b.style.cssText=`width:${z}px;height:${z}px;right:${x}px;top:${y}px`;btn.appendChild(b);});
  btn.classList.add('bitten');
  const rc=btn.getBoundingClientRect();
  for(let k=0;k<14;k++){const c=document.createElement('i');c.className='crumb';
    c.style.left=(rc.right-20)+'px';c.style.top=(rc.top+10)+'px';document.body.appendChild(c);
    c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},
      {transform:`translate(${(Math.random()*160-40)}px,${120+Math.random()*200}px) rotate(${Math.random()*720}deg)`,opacity:0}],
      {duration:700+Math.random()*400,easing:'cubic-bezier(.3,0,.9,.6)',fill:'forwards'}).onfinish=()=>c.remove();}
  setTimeout(()=>spread(()=>{go(next);btn.classList.remove('bitten');}),420);
}
const pour=document.getElementById('pour');
function spread(mid){
  pour.style.visibility='visible';
  const o={duration:900,easing:'cubic-bezier(.55,0,.45,1)',fill:'forwards'};
  pour.animate([{transform:'translateY(-160%)'},{transform:'translateY(0)'}],o).onfinish=()=>{
    mid();
    pour.animate([{transform:'translateY(0)'},{transform:'translateY(170%)'}],{...o,duration:1000}).onfinish=()=>{
      pour.style.visibility='hidden'; busy=false; };
  };
}
/* gold dust */
const dust=document.getElementById('dust');
for(let k=0;k<18;k++){const e=document.createElement('b');
  e.style.cssText=`left:${Math.random()*100}%;--dx:${(Math.random()*80-40)}px;animation-duration:${9+Math.random()*10}s;animation-delay:-${Math.random()*18}s;transform:scale(${.5+Math.random()})`;
  dust.appendChild(e);}
/* finger trail */
const cv=document.getElementById('trail'), cx=cv.getContext('2d'), cv2=document.getElementById('trail2'), cx2=cv2.getContext('2d');
function size(){const p=devicePixelRatio||1;[[cv,cx],[cv2,cx2]].forEach(([c,x])=>{c.width=innerWidth*p;c.height=innerHeight*p;x.setTransform(p,0,0,p,0,0);});}
size(); addEventListener('resize',size);
let last=null;
addEventListener('pointerdown',e=>{last=[e.clientX,e.clientY];dab(e.clientX,e.clientY,e.clientX+.1,e.clientY);});
addEventListener('pointerup',()=>last=null); addEventListener('pointercancel',()=>last=null);
addEventListener('pointermove',e=>{ if(!last||!(e.buttons||e.pointerType==='touch')) return;
  dab(last[0],last[1],e.clientX,e.clientY); last=[e.clientX,e.clientY]; });
function line(c,col,w,x1,y1,x2,y2){c.globalCompositeOperation='source-over';c.lineCap='round';c.lineJoin='round';
  c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}
function dab(x1,y1,x2,y2){
  line(cx,'#3a1508',28,x1,y1,x2,y2);
  line(cx2,'#7a3a17',14,x1,y1,x2,y2);
  line(cx2,'#c4865a',4,x1-4,y1-5,x2-4,y2-5);
}
(function fade(){ [cx,cx2].forEach(c=>{c.globalCompositeOperation='destination-out'; c.fillStyle='rgba(0,0,0,.025)';
  c.fillRect(0,0,innerWidth,innerHeight);}); requestAnimationFrame(fade); })();
go('s1');
</script>
